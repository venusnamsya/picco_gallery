<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-[#fdfbf7] text-gray-800 min-h-screen flex flex-col">
    
    <!-- Navbar -->
    <nav class="bg-[#4c1d95] text-[#fdfbf7] shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{% url 'homepage' %}" class="text-2xl font-bold tracking-wide">AuraGallery</a>
            <div class="space-x-4">
                <a href="{% url 'homepage' %}" class="hover:underline">Home</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="hover:underline">Profile ({{ user.username }})</a>
                    <a href="{% url 'logout' %}" class="hover:underline bg-[#5c24b3] px-3 py-1.5 rounded">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="hover:underline">Login</a>
                    <a href="{% url 'register' %}" class="bg-[#fdfbf7] text-[#4c1d95] px-3 py-1.5 rounded font-semibold hover:bg-gray-100">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-4 rounded bg-purple-100 text-purple-800 font-medium">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-[#4c1d95] text-[#fdfbf7] text-center py-4 text-sm mt-auto">
        &copy; 2026 AuraGallery. All rights reserved.
    </footer>
</body>
</html>
