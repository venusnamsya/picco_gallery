{% comment %} {% extends 'photo_gallery/base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto bg-white border border-gray-100 rounded-2xl shadow-lg overflow-hidden">
    <img src="{{ photo.image.url }}" alt="{{ photo.title }}" class="w-full max-h-[500px] object-cover">
    
    <div class="p-8">
        <div class="flex justify-between items-start mb-4">
            <h1 class="text-3xl font-bold text-gray-900">{{ photo.title }}</h1>
            
            <!-- Voting Actions -->
            <div class="flex items-center space-x-3">
                <a href="{% url 'like_photo' photo.pk %}" class="flex items-center space-x-1 px-3 py-1.5 rounded-lg border text-sm font-semibold {% if user in photo.likes.all %}bg-[#4c1d95] text-[#fdfbf7]{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
                    <span>👍</span> <span>{{ photo.likes.count }}</span>
                </a>
                <a href="{% url 'dislike_photo' photo.pk %}" class="flex items-center space-x-1 px-3 py-1.5 rounded-lg border text-sm font-semibold {% if user in photo.dislikes.all %}bg-[#4c1d95] text-[#fdfbf7]{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
                    <span>👎</span> <span>{{ photo.dislikes.count }}</span>
                </a>
            </div>
        </div>

        <div class="flex flex-wrap gap-2 mb-6">
            {% for tag in photo.tags.all %}
                <span class="text-sm font-medium text-[#4c1d95] bg-purple-50 px-3 py-1 rounded-full">#{{ tag.name }}</span>
            {% endfor %}
        </div>

        <p class="text-gray-700 leading-relaxed text-lg">{{ photo.description }}</p>
        
        <div class="mt-8 pt-6 border-t border-gray-100">
            <a href="{% url 'homepage' %}" class="text-[#4c1d95] font-semibold hover:underline">&larr; Back to gallery</a>
        </div>
    </div>
</div>
{% endblock %} {% endcomment %}
