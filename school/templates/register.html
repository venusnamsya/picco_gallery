{% extends 'photo_gallery/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-gray-100 p-8 rounded-2xl shadow-lg mt-12">
    <h2 class="text-2xl font-bold text-[#4c1d95] mb-6 text-center">Create Account</h2>
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" class="w-full bg-[#4c1d95] text-[#fdfbf7] py-2.5 rounded-lg font-semibold hover:bg-[#3b1675] transition mt-2">
            Register
        </button>
    </form>
    
    <p class="text-sm text-gray-600 text-center mt-6">
        Already have an account? 
        <a href="{% url 'login' %}" class="text-[#4c1d95] font-semibold hover:underline">Log in here</a>
    </p>
</div>
{% endblock %}
